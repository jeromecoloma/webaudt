version: 2

project_name: webaudt

before:
  hooks:
    - go mod tidy

builds:
  - id: webaudt
    main: ./cmd/webaudt
    binary: webaudt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}

archives:
  - id: webaudt
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^style:'

release:
  draft: false
  prerelease: auto
  header: |
    ## webaudt {{ .Tag }}

    Prebuilt binaries for macOS (Apple Silicon + Intel) and Linux (amd64 + arm64).
  footer: |
    ---
    **Install:**

    ```sh
    curl -fsSL https://raw.githubusercontent.com/jeromecoloma/webaudt/main/install.sh | bash
    ```

    Verifies the archive's sha256 against `checksums.txt` before installing.

    To install by hand, download the archive and `checksums.txt`, run
    `shasum -a 256 -c checksums.txt --ignore-missing` (`sha256sum -c` on Linux),
    then extract and move `webaudt` onto your `$PATH`.
